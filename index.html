<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration System</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <div class="container my-5">
    <div class="card shadow-lg p-4">
      <h2 class="text-center mb-4 text-primary">Student Registration Form</h2>
      
      <form id="registrationForm">
        <div class="row">
          <!-- Name -->
          <div class="col-md-6 mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>

          <!-- Email -->
          <div class="col-md-6 mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <!-- Date of Birth -->
          <div class="col-md-6 mb-3">
            <label for="dob" class="form-label">Date of Birth</label>
            <input type="date" class="form-control" id="dob" required>
          </div>

          <!-- Age (Calculated Automatically) -->
          <div class="col-md-6 mb-3">
            <label for="age" class="form-label">Age</label>
            <input type="text" class="form-control" id="age" readonly placeholder="Calculated automatically">
          </div>

          <!-- Course -->
          <div class="col-md-6 mb-3">
            <label for="course" class="form-label">Course</label>
            <select class="form-select" id="course" required>
              <option value="">Select Course</option>
              <option value="DCA">DCA</option>
              <option value="BCA">BCA</option>
              <option value="Web Development">Web Development</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Register Student</button>
      </form>

      <hr class="my-5">

      <h3 class="text-secondary mb-3">Registered Students List</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover" id="studentTable">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
              <th>DOB</th>
              <th>Age</th>
              <th>Course</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- Data will be inserted dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
